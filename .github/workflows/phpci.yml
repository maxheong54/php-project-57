name: PHP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-versions: ['8.4']

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, bcmath, ctype, fileinfo, json, tokenizer, xml, pdo, pdo_mysql, openssl, curl, zip, imagick, swoole
          
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
            
      - name: Setup project
        run: make setup

      - name: Check lint
        run: make lint

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # NOTE: https://sonarcloud.io/project/information?id=<organization>_<reponame>
          args: >
            -Dsonar.projectKey=maxheong54_php-project-572
            -Dsonar.organization=maxheong54
            -Dsonar.sources=src/
            -Dsonar.php.coverage.reportPaths=build/logs/clover.xml